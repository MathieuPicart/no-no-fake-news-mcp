<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="popup-container">
        <header>
            <div class="logo">
                <span class="logo-red">No</span><span class="logo-white">No</span>
                <span class="logo-subtitle">Fake News</span>
            </div>
        </header>

        <main id="mainView">
            <!-- Loader State -->
            <div id="loader" class="hidden">
                <div class="spinner"></div>
                <p class="loading-text">Analyse en cours...</p>
            </div>

            <!-- Initial State / Error -->
            <div id="initialState">
                <button id="analyzeBtn" class="primary-btn">Analyser la page</button>
            </div>

            <!-- Result State -->
            <div id="resultView" class="hidden">
                <div class="score-card">
                    <div class="score-circle-container">
                        <svg viewBox="0 0 100 100">
                            <circle class="bg" cx="50" cy="50" r="45"></circle>
                            <circle id="scoreProgress" class="progress" cx="50" cy="50" r="45"></circle>
                        </svg>
                        <div class="score-content">
                            <span id="scoreValue">0</span>
                            <span class="score-label">/100</span>
                        </div>
                    </div>
                    <div id="verdictBadge" class="verdict-pill">Fiable</div>
                </div>

                <h3 id="articleTitle">Titre de l'article</h3>
                <p id="verdictMessage">Analyse de la fiabilité...</p>

                <div class="actions">
                    <a id="fullReportBtn" href="#" target="_blank" class="secondary-btn">Voir le rapport complet</a>
                </div>
            </div>
        </main>
    </div>
    <script src="popup.js"></script>
</body>

</html>
